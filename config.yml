# ลิงก์ตรงไปยังไฟล์ ThaiFont-Itim.zip (ต้องกดแล้วดาวน์โหลดไฟล์ได้เลย)
# ตัวอย่าง GitHub Release:
# https://github.com/ชื่อคุณ/ชื่อrepo/releases/download/v1/ThaiFont-Itim.zip
pack-url: "https://example.com/ThaiFont-Itim.zip"

# SHA-1 ของไฟล์ zip (40 ตัวอักษร) ถ้าแก้ไฟล์ zip ต้องเปลี่ยนค่านี้ตาม
# ปล่อยว่างได้ แต่จะไม่มีการตรวจไฟล์/แคช
pack-sha1: "4c5510124a8bf9ce0278d2afe0f8c3ce8ac006f2"

# บังคับให้ผู้เล่นต้องโหลด (ถ้าปฏิเสธจะเข้าเซิร์ฟไม่ได้)
force: false

# ถ้า force เป็น true หรืออยากเตะคนที่ปฏิเสธ/โหลดไม่สำเร็จ ให้เปิดข้อนี้
kick-if-failed: false

# ข้อความที่แสดงตอนขอให้โหลด (รองรับ MiniMessage)
prompt: "<gold>เซิร์ฟเวอร์นี้มีฟอนต์ไทยน่ารักๆ กดยอมรับเพื่อใช้งานนะ</gold>"

# ข้อความตอนถูกเตะ
kick-message: "<red>กรุณายอมรับ Resource Pack ฟอนต์ไทยเพื่อเข้าเซิร์ฟเวอร์</red>"

# --- ปรับตำแหน่งสระ/วรรณยุกต์ให้ไม่ซ้อนกัน ---
# ต้องใช้คู่กับ Resource Pack เวอร์ชันนี้ (ผู้เล่นที่ไม่ได้โหลด pack จะเห็นเป็นช่องสี่เหลี่ยมแทนบางตัวอักษร
# จึงแนะนำให้ตั้ง force: true)
shape-chat: true
shape-signs: true
